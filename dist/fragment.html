<title>Signal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<style>
/* Signal. Cyanotype plate look: prussian-blue ground, pale-blue linework, one hot pink for impulses.
   Layout: bottom tabs on phones, left rail on wide screens. Content is left aligned. */
:root{
  --bg:#0A2744; --s1:#0F345C; --s2:#164575; --s3:#1d5690;
  --line:#2D6397; --line2:#4B86BC;
  --ink:#E8F3FB; --mut:#9DBEDA;
  --signal:#FF5C9A; --amber:#FFB84D; --sky:#7CC8FF; --violet:#B7A0FF; --mint:#55E3B5;
  --good:#4BE3A5; --bad:#FF7C7C; --on-signal:#0A2744;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.5);
  --f-disp:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --r1:10px; --r2:18px; --nav-h:64px; --gut:16px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EAF3F9; --s1:#FFFFFF; --s2:#DCEAF4; --s3:#C9DDEC;
  --line:#A9C6DD; --line2:#6F9CC2;
  --ink:#0A2744; --mut:#456985;
  --signal:#C2185B; --amber:#9A5700; --sky:#0B66AE; --violet:#5B35C8; --mint:#0A7656;
  --good:#0A7A4E; --bad:#C62828; --on-signal:#fff;
  --shadow:0 1px 2px rgba(10,39,68,.08),0 12px 28px -14px rgba(10,39,68,.28);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EAF3F9; --s1:#FFFFFF; --s2:#DCEAF4; --s3:#C9DDEC;
  --line:#A9C6DD; --line2:#6F9CC2;
  --ink:#0A2744; --mut:#456985;
  --signal:#C2185B; --amber:#9A5700; --sky:#0B66AE; --violet:#5B35C8; --mint:#0A7656;
  --good:#0A7A4E; --bad:#C62828; --on-signal:#fff;
  --shadow:0 1px 2px rgba(10,39,68,.08),0 12px 28px -14px rgba(10,39,68,.28);
  color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;--grid:color-mix(in srgb,var(--line) 14%,transparent);
  padding-inline:0;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;max-width:100%}
h1,h2,h3,h4{font-family:var(--f-disp);font-variation-settings:"wdth" 82;font-weight:700;line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(34px,7vw,52px);font-weight:800}
h2{font-size:clamp(25px,4.6vw,32px)}
h3{font-size:20px}
h4{font-size:16px;font-variation-settings:"wdth" 90}
p{margin:0}
.mut{color:var(--mut)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
::selection{background:var(--signal);color:var(--on-signal)}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px var(--gut);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.mark{display:flex;align-items:center;gap:8px;font:800 24px/1 var(--f-disp);font-variation-settings:"wdth" 78;letter-spacing:-.02em;background:none;border:0;padding:0}
.mark svg{width:34px;height:20px;overflow:visible}
.top .sp{flex:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:5px 12px 5px 6px;font-size:13.5px;font-weight:700;min-height:36px}
.chip .rk{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--signal);color:var(--on-signal);font:800 13px var(--f-disp)}
.ibtn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--s1);padding:0}
.ibtn svg{width:19px;height:19px}
.ibtn[aria-pressed="true"]{background:var(--s3);border-color:var(--line2)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:0 6px env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:12px;font-weight:700;border-radius:12px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--signal)}
main{padding:20px var(--gut) 40px;width:100%;max-width:1060px;margin:0 auto;min-width:0}
@media(min-width:900px){
  .shell{grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;padding-bottom:0}
  .top{grid-column:1/3}
  .nav{position:sticky;top:60px;bottom:auto;height:calc(100vh - 60px);grid-column:1;grid-row:2;grid-template-columns:1fr;grid-auto-rows:52px;align-content:start;gap:4px;padding:18px 14px;border-top:0;border-right:1px solid var(--line);background:transparent;backdrop-filter:none}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:15px}
  .nav button[aria-current="page"]{background:var(--s1);box-shadow:var(--shadow)}
  main{grid-column:2;grid-row:2;padding:28px 36px 60px}
}

/* generic parts */
.view{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;border-radius:99px;border:1.5px solid var(--line2);background:var(--s1);font-weight:700;font-size:16px;text-align:center;transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 15px;font-size:14.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:18px;box-shadow:var(--shadow)}
.panel{border-top:1px solid var(--line);padding-top:18px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--mut);font-weight:700;padding:6px 8px 6px 0;font-size:15px}
.back svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700;border:1px solid currentColor}
.seg{display:flex;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:99px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:38px;padding:0 16px;border-radius:99px;border:0;background:transparent;font-weight:700;font-size:14.5px;color:var(--mut);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--s3);color:var(--ink)}
.hint-line{display:flex;gap:10px;align-items:flex-start;color:var(--mut);font-size:14.5px}
.tc-nv{--tc:var(--signal)}.tc-rf{--tc:var(--amber)}.tc-ey{--tc:var(--sky)}.tc-hm{--tc:var(--violet)}.tc-pl{--tc:var(--mint)}
.plateno{font:800 15px var(--f-disp);font-variation-settings:"wdth" 80;color:var(--tc,var(--signal));letter-spacing:.02em}

/* ring */
.ring{--p:0;position:relative;width:var(--sz,52px);height:var(--sz,52px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--s3)}
.ring .fg{stroke:var(--tc,var(--signal));stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--sz,52px)*.28) var(--f-disp)}

/* ---- home ---- */
.hello{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.hello h1{max-width:12ch}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font:800 30px/1 var(--f-disp);font-variation-settings:"wdth" 80}
.stat span{font-size:13.5px;color:var(--mut)}
.homegrid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:820px){.homegrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.plate{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:340/580}
.plate>svg{position:absolute;inset:0;width:100%;height:100%}
.hot{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:2px solid var(--tc);background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;padding:0;color:var(--tc)}
.hot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--tc);animation:ping 2.6s ease-out infinite;opacity:0}
.hot:nth-of-type(2)::after{animation-delay:.5s}.hot:nth-of-type(3)::after{animation-delay:1s}.hot:nth-of-type(4)::after{animation-delay:1.5s}.hot:nth-of-type(5)::after{animation-delay:2s}
@keyframes ping{0%{transform:scale(.8);opacity:.9}70%,100%{transform:scale(1.9);opacity:0}}
.hot b{font:800 15px var(--f-disp)}
.plabel{position:absolute;font:700 13.5px/1.15 var(--f-disp);font-variation-settings:"wdth" 88;color:var(--ink);background:none;border:0;padding:4px;text-align:left}
.plabel small{display:block;font:400 12px var(--f-body);color:var(--mut)}
.plabel.r{text-align:right}
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:var(--r2);border:1px solid var(--line);background:var(--s1)}
.trow .pn{font:800 26px var(--f-disp);font-variation-settings:"wdth" 75;color:var(--tc);width:34px}
.trow h3{font-size:18px}
.next{display:flex;flex-direction:column;gap:12px}
.chain{display:flex;align-items:center;gap:0;margin-top:2px}
.chain i{flex:1;height:3px;background:var(--s3);position:relative}
.chain i.on{background:var(--signal)}
.chain u{width:14px;height:14px;border-radius:50%;background:var(--s3);border:2px solid var(--s3);flex:none;text-decoration:none}
.chain u.on{background:var(--signal);border-color:var(--signal)}
.chain u.cur{background:var(--bg);border-color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 25%,transparent)}
.pulse-path{fill:none;stroke:var(--signal);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:.08 1;stroke-dashoffset:.08;opacity:0}
.pulse-path.go{animation:trace 2.6s cubic-bezier(.45,.05,.4,1) forwards}
@keyframes trace{0%{stroke-dashoffset:.08;opacity:1}98%{opacity:1}100%{stroke-dashoffset:-1;opacity:0}}

/* ---- topic ---- */
.thead{display:flex;gap:16px;align-items:center}
.thead .big{font:800 clamp(60px,16vw,96px)/.8 var(--f-disp);font-variation-settings:"wdth" 75;color:var(--tc)}
.notes{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.notes li{display:grid;grid-template-columns:18px 1fr;gap:10px}
.notes li::before{content:"";width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--tc);justify-self:center}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.term{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r1);background:var(--s1)}
.term b{font-family:var(--f-disp);font-variation-settings:"wdth" 90;color:var(--tc)}
.actions{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.actions .btn{justify-content:flex-start;padding:0 18px;min-height:56px;border-radius:16px}

/* ---- question runner ---- */
.runner{display:flex;flex-direction:column;gap:16px;max-width:720px;width:100%;margin:0 auto}
.rhead{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--s3)}
.dots i.ok{background:var(--good)}.dots i.part{background:var(--amber)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--signal)}
.qcard{padding:20px;display:flex;flex-direction:column;gap:16px}
.qcard.in{animation:qin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;transform:translateY(10px)}}
.qtype{font-size:13.5px;color:var(--mut);display:flex;gap:8px;align-items:center}
.qtext{font:600 clamp(19px,4.4vw,23px)/1.3 var(--f-disp);font-variation-settings:"wdth" 94;letter-spacing:-.005em}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;min-height:54px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16.5px;transition:background .15s,border-color .15s}
.opt .k{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--s2);font:800 13px var(--f-disp)}
.opt:not([disabled]):hover{border-color:var(--line2)}
.opt.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 16%,var(--bg))}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--bg))}
.opt.good .k{background:var(--good);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--bg))}
.opt.bad .k{background:var(--bad);color:var(--bg)}
.opt.gone{opacity:.28}
.opt[disabled]{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1.5px solid;animation:qin .3s}
.fb.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.fb.mid{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--bg))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--bg))}
.fb svg{width:22px;height:22px;flex:none;margin-top:1px}
.fb.ok svg{color:var(--good)}.fb.mid svg{color:var(--amber)}.fb.no svg{color:var(--bad)}
.fb b{font-family:var(--f-disp);font-variation-settings:"wdth" 90}
.xpfly{position:fixed;left:50%;top:40%;z-index:80;font:800 32px var(--f-disp);color:var(--signal);pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-70px);opacity:0}}
.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border:1.5px dashed var(--line2);border-radius:14px;align-items:center}
.seq .st{display:flex;gap:8px;align-items:center;background:var(--s3);border-radius:10px;padding:6px 10px;font-size:15px}
.seq .st b{font:800 13px var(--f-disp);color:var(--signal)}
.seq .st.good{background:color-mix(in srgb,var(--good) 24%,var(--s1))}
.seq .st.bad{background:color-mix(in srgb,var(--bad) 24%,var(--s1))}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair-grid .col{display:flex;flex-direction:column;gap:10px}
.pbtn{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:8px 10px;text-align:left;font-size:15px;position:relative}
.pbtn.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 16%,var(--bg))}
.pbtn .tag{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--f-disp);background:var(--signal);color:var(--on-signal)}
.pbtn.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--bg))}
.pbtn.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.sortrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sortrow .ch{display:flex;gap:6px}
.sortrow .ch button{min-height:40px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px}
.sortrow .ch button.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 18%,var(--bg))}
.sortrow .ch button.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--bg))}
.sortrow .ch button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--bg))}
.diag{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:8px}
.diag svg{width:100%;height:auto;max-height:340px}
.part{cursor:pointer}
.part .shape{transition:fill .15s,stroke .15s}
.part:hover .shape,.part:focus-visible .shape{stroke:var(--signal)}
.part.sel .shape{stroke:var(--sky);stroke-width:3}
.part.good .shape{stroke:var(--good);stroke-width:3.5}
.part.bad .shape{stroke:var(--bad);stroke-width:3.5}
textarea.ans{width:100%;min-height:120px;resize:vertical;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);line-height:1.5}
.mp{display:flex;flex-direction:column;gap:8px}
.mpi{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.mpi .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center}
.mpi.got{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.mpi.got .bx{background:var(--good);border-color:var(--good);color:var(--bg)}
.mpi.miss{border-color:var(--line)}
.mpi .bx svg{width:15px;height:15px}
.model{padding:12px 14px;border-radius:12px;background:var(--s2);font-size:15px}
.fig{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:10px}
.fig svg{width:100%;height:auto}
.storybox{padding:16px 18px;border-left:4px solid var(--tc,var(--signal));background:var(--s2);border-radius:0 14px 14px 0;font-size:17px;line-height:1.5}

/* ---- summary ---- */
.sum-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigscore{font:800 clamp(56px,16vw,88px)/.9 var(--f-disp);font-variation-settings:"wdth" 75}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--s1)}
.rv summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv .dot{width:12px;height:12px;border-radius:50%;flex:none}
.rv .dot.ok{background:var(--good)}.rv .dot.part{background:var(--amber)}.rv .dot.no{background:var(--bad)}

/* ---- labs ---- */
.labgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.labcard{display:flex;flex-direction:column;gap:12px;text-align:left;padding:0;overflow:hidden;border-radius:var(--r2);border:1px solid var(--line);background:var(--s1);box-shadow:var(--shadow)}
.labcard .art{height:130px;background:var(--bg);border-bottom:1px solid var(--line);display:grid;place-items:center;color:var(--tc)}
.labcard .art svg{height:110px;width:auto}
.labcard .bd{padding:0 16px 16px;display:flex;flex-direction:column;gap:6px}
.stage{border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);overflow:hidden;position:relative}
.stage svg,.stage canvas{width:100%;height:auto;display:block}
.ctrl{display:flex;flex-direction:column;gap:14px}
.sl{display:grid;gap:6px}
.sl label{display:flex;justify-content:space-between;font-weight:700;font-size:15px}

/* ---- js/questions.js ---- */
/* ===== Question engine: every type renders from (question, session) and grades to a fraction ===== */
const TYPE_LABEL = { mcq: 'Multiple choice', tf: 'True or false', order: 'Put in order', match: 'Match up', sort: 'Sort into groups', label: 'Tap the diagram', explain: 'Written answer' };
const marksOf = q => q.type === 'explain' ? q.marks : (q.type === 'order' || q.type === 'match' || q.type === 'sort') ? 2 : 1;
const norm = s => ' ' + String(s).toLowerCase().replace(/[^a-z0-9\s'’-]/g, ' ').replace(/\s+/g, ' ') + ' ';
const LET = 'ABCD';
const OK_ICON = ico('check'), NO_ICON = ico('x');

const QT = {
  mcq: {
    init: (q, s) => { s.order = s.order || shuffle([q.a, ...q.w]) },
    view(q, s, o) {
      const fig = q.fig ? `<div class="fig">${chartSVG(q.fig)}</div>` : '';
      const opts = s.order.map((t, i) => {
        let c = 'opt';
        if (s.reveal) { if (t === q.a) c += ' good'; else if (t === s.v) c += ' bad' } else if (t === s.v) c += ' sel';
        if (s.gone && s.gone.includes(t) && !s.reveal) c += ' gone';
        return `<button class="${c}" data-v="${esc(t)}" ${s.reveal || (s.gone && s.gone.includes(t)) ? 'disabled' : ''}><span class="k">${LET[i]}</span><span>${esc(t)}</span></button>`;
      }).join('');
      const hint = (o.mode === 'practice' && !s.reveal && !s.hinted) ? `<button class="btn ghost sm" data-hint style="align-self:flex-start">Remove two wrong answers (half marks)</button>` : '';
      return `<p class="qtext">${esc(q.q)}</p>${fig}<div class="opts">${opts}</div>${hint}`;
    },
    bind(h, q, s, api, o) {
      $$('.opt', h).forEach(b => b.onclick = () => { api.set(b.dataset.v); if (o.mode === 'practice') api.submit() });
      const hb = $('[data-hint]', h); if (hb) hb.onclick = () => { s.hinted = true; s.gone = shuffle(s.order.filter(t => t !== q.a)).slice(0, 2); api.draw() };
    },
    complete: (q, s) => s.v !== undefined,
    grade: (q, s) => s.v === q.a ? (s.hinted ? .5 : 1) : 0
  },
  tf: {
    view(q, s) {
      const mk = (val, lab, ic) => { let c = 'opt'; if (s.reveal) { if (val === q.a) c += ' good'; else if (val === s.v) c += ' bad' } else if (val === s.v) c += ' sel'; return `<button class="${c}" data-v="${val}" ${s.reveal ? 'disabled' : ''}><span class="k">${ic}</span><span>${lab}</span></button>` };
      return `<p class="qtext">${esc(q.q)}</p><div class="opts two">${mk(true, 'True', OK_ICON)}${mk(false, 'False', NO_ICON)}</div>`;
    },
    bind(h, q, s, api, o) { $$('.opt', h).forEach(b => b.onclick = () => { api.set(b.dataset.v === 'true'); if (o.mode === 'practice') api.submit() }) },
    complete: (q, s) => s.v !== undefined,
    grade: (q, s) => s.v === q.a ? 1 : 0
  },
  order: {
    init: (q, s) => { s.order = s.order || shuffle(q.steps.map((_, i) => i)); s.v = s.v || [] },
    view(q, s) {
      const n = q.steps.length;
      const chosen = s.v.map((i, k) => { let c = 'st'; if (s.reveal) c += q.steps[k] === q.steps[i] ? ' good' : ' bad'; return `<span class="${c}"><b>${k + 1}</b>${esc(q.steps[i])}</span>` }).join('');
      const pool = s.order.filter(i => !s.v.includes(i)).map(i => `<button class="opt" data-i="${i}" style="grid-template-columns:1fr"><span>${esc(q.steps[i])}</span></button>`).join('');
      const ctl = !s.reveal && s.v.length ? `<div class="row"><button class="btn ghost sm" data-undo>${ico('back')}Undo</button><button class="btn ghost sm" data-clear>Clear</button></div>` : '';
      const ans = s.reveal ? `<div class="model"><b>Correct order</b><ol style="margin:6px 0 0;padding-left:22px">${q.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>` : '';
      return `<p class="qtext">${esc(q.q)}</p><div class="seq" aria-label="Your order">${chosen || '<span class="mut small">Tap the steps in order, first to last.</span>'}</div>${s.reveal ? '' : `<div class="opts">${pool}</div>`}${ctl}${ans}`;
    },
    bind(h, q, s, api) {
      $$('[data-i]', h).forEach(b => b.onclick = () => { api.set([...s.v, +b.dataset.i]) });
      const u = $('[data-undo]', h); if (u) u.onclick = () => api.set(s.v.slice(0, -1));
      const c = $('[data-clear]', h); if (c) c.onclick = () => api.set([]);
    },
    complete: (q, s) => s.v.length === q.steps.length,
    grade: (q, s) => { const ok = s.v.filter((i, k) => i === k).length; return ok === q.steps.length ? 1 : ok / q.steps.length * .75 }
  },
  match: {
    init: (q, s) => { s.order = s.order || shuffle(q.pairs.map((_, i) => i)); s.v = s.v || {}; s.sel = null },
    view(q, s) {
      const tagL = i => s.v[i] !== undefined ? `<span class="tag">${Object.keys(s.v).indexOf(String(i)) + 1}</span>` : '';
      const rightOf = {}; Object.entries(s.v).forEach(([l, r], k) => rightOf[r] = k + 1);
      const L = q.pairs.map((p, i) => { let c = 'pbtn'; if (s.reveal) c += s.v[i] === i ? ' good' : ' bad'; else if (s.sel === i) c += ' sel'; return `<button class="${c}" data-l="${i}" ${s.reveal ? 'disabled' : ''}>${esc(p[0])}${tagL(i)}</button>` }).join('');
      const Rr = s.order.map(i => { const t = rightOf[i]; return `<button class="pbtn" data-r="${i}" ${s.reveal ? 'disabled' : ''}>${esc(q.pairs[i][1])}${t ? `<span class="tag">${t}</span>` : ''}</button>` }).join('');
      const fix = s.reveal ? `<div class="model"><b>Correct pairs</b><ul style="margin:6px 0 0;padding-left:20px">${q.pairs.map(p => `<li>${esc(p[0])}: ${esc(p[1])}</li>`).join('')}</ul></div>` : '';
      return `<p class="qtext">${esc(q.q)}</p><p class="mut small">Tap a term, then tap its match. Tap a matched term to undo.</p><div class="pair-grid"><div class="col">${L}</div><div class="col">${Rr}</div></div>${fix}`;
    },
    bind(h, q, s, api) {
      $$('[data-l]', h).forEach(b => b.onclick = () => { const i = +b.dataset.l; if (s.v[i] !== undefined) { const v = { ...s.v }; delete v[i]; s.sel = null; api.set(v) } else { s.sel = s.sel === i ? null : i; api.draw() } });
      $$('[data-r]', h).forEach(b => b.onclick = () => {
        const r = +b.dataset.r; if (s.sel === null) return;
        const v = { ...s.v }; Object.keys(v).forEach(k => { if (v[k] === r) delete v[k] }); v[s.sel] = r; s.sel = null; api.set(v);
      });
    },
    complete: (q, s) => Object.keys(s.v).length === q.pairs.length,
    grade: (q, s) => q.pairs.filter((_, i) => s.v[i] === i).length / q.pairs.length
  },
  sort: {
    init: (q, s) => { s.order = s.order || shuffle(q.items.map((_, i) => i)); s.v = s.v || [] },
    view(q, s) {
      const rows = s.order.map(i => {
        const btn = k => { let c = ''; if (s.reveal) { if (q.items[i][1] === k) c = 'good'; else if (s.v[i] === k) c = 'bad' } else if (s.v[i] === k) c = 'sel'; return `<button class="${c}" data-i="${i}" data-k="${k}" ${s.reveal ? 'disabled' : ''}>${esc(q.cats[k])}</button>` };
        return `<div class="sortrow"><span>${esc(q.items[i][0])}</span><div class="ch">${btn(0)}${btn(1)}</div></div>`;
      }).join('');
      return `<p class="qtext">${esc(q.q)}</p><div>${rows}</div>`;
    },
    bind(h, q, s, api) { $$('[data-k]', h).forEach(b => b.onclick = () => { const v = s.v.slice(); v[+b.dataset.i] = +b.dataset.k; api.set(v) }) },
    complete: (q, s) => q.items.every((_, i) => s.v[i] !== undefined),
    grade: (q, s) => q.items.filter((it, i) => s.v[i] === it[1]).length / q.items.length
  },
  label: {
    view(q, s) {
      const nm = s.reveal ? `<div class="callout"><b>${esc(DIAG[q.diagram].parts[q.part])}</b>. ${esc(q.why)}</div>` : '';
      return `<p class="qtext">${esc(q.q)}</p>${diagramHTML(q.diagram)}${nm}`;
    },
    bind(h, q, s, api, o) {
      $$('.part', h).forEach(g => {
        const id = g.dataset.p;
        if (s.reveal) { if (id === q.part) g.classList.add('good'); else if (id === s.v) g.classList.add('bad') } else if (id === s.v) g.classList.add('sel');
        const act = () => { if (s.reveal) return; api.set(id); if (o.mode === 'practice') api.submit() };
        g.onclick = act; g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act() } };
      });
    },
    complete: (q, s) => !!s.v,
    grade: (q, s) => s.v === q.part ? 1 : 0
  },
  explain: {
    view(q, s, o) {
      const pts = s.reveal ? autoMark(q, s) : null;
      const mp = s.reveal ? `<div class="mp">${q.points.map((p, i) => `<button class="mpi ${s.marks[i] ? 'got' : 'miss'}" data-m="${i}"><span class="bx">${s.marks[i] ? ico('check') : ''}</span><span>${esc(p.label)}</span></button>`).join('')}</div><p class="tiny mut">Tap a point to switch it if the check got it wrong.</p><div class="model"><b>Model answer</b><br>${esc(q.model)}</div>` : '';
      const box = s.reveal ? `<div class="model" style="white-space:pre-wrap"><b>Your answer</b><br>${esc(s.v || '(blank)')}</div>` : `<textarea class="ans" id="ans" rows="5" placeholder="Write your answer here. Use key words from your notes." aria-label="Your answer">${esc(s.v || '')}</textarea>`;
      return `<p class="qtext">${esc(q.q)} <span class="mut" style="font-weight:400">(${q.marks} mark${q.marks > 1 ? 's' : ''})</span></p>${box}${mp}`;
    },
    bind(h, q, s, api, o) {
      const ta = $('#ans', h); if (ta) ta.oninput = () => { s.v = ta.value; o.onChange && o.onChange(s.v, QT.explain.complete(q, s)) };
      $$('[data-m]', h).forEach(b => b.onclick = () => { s.marks[+b.dataset.m] = !s.marks[+b.dataset.m]; api.draw(); o.onMarks && o.onMarks() });
    },
    complete: (q, s) => (s.v || '').trim().length > 2,
    grade: (q, s) => { autoMark(q, s); return s.marks.filter(Boolean).length / q.marks }
  }
};
function autoMark(q, s) {
  if (!s.marks) { const t = norm(s.v || ''); s.marks = q.points.map(p => p.rx.some(r => { try { return new RegExp(r, 'i').test(t) } catch (e) { return false } })) }
  return s.marks;
}

/* mountQ: draws a question into host. sess is the per-question state kept by the caller. */
function mountQ(host, q, sess, o = {}) {
  const T = QT[q.type]; if (T.init) T.init(q, sess);
  const api = {
    draw() { host.innerHTML = T.view(q, sess, o); T.bind && T.bind(host, q, sess, api, o) },
    set(v) { sess.v = v; o.onChange && o.onChange(v, T.complete(q, sess)); api.draw() },
    submit() { o.onSubmit && o.onSubmit() }
  };
  api.draw(); return api;
}
const ensureQ = (q, s) => { const T = QT[q.type]; if (T.init) T.init(q, s) };
const gradeQ = (q, sess) => { ensureQ(q, sess); return QT[q.type].grade(q, sess) };
const completeQ = (q, sess) => { ensureQ(q, sess); return QT[q.type].complete(q, sess) };

/* ---------- choosing questions ---------- */
const CAP = { match: 1, sort: 1, order: 1, explain: 1, label: 2 };
function pickSession(pool, n, opts = {}) {
  const p = P(), t = day(), tcap = opts.perTopic || 99;
  const sc = pool.map(q => {
    const r = p.q[q.id]; let pr;
    if (!r) pr = 2 + Math.random();
    else if (r.due <= t) pr = 4 + (6 - r.b) * .3 + Math.random() * .6;
    else pr = Math.random() * 1.5;
    if (r && r.n && r.ok / r.n < .5) pr += 1;
    return { q, pr };
  }).sort((a, b) => b.pr - a.pr);
  const out = [], cnt = {}, tc = {};
  for (const { q } of sc) {
    if (out.length >= n) break;
    if ((cnt[q.type] || 0) >= (CAP[q.type] || 99)) continue;
    if ((tc[q.t] || 0) >= tcap) continue;
    out.push(q); cnt[q.type] = (cnt[q.type] || 0) + 1; tc[q.t] = (tc[q.t] || 0) + 1;
  }
  // spread: avoid two heavy interactive questions in a row
  const heavy = x => ['match', 'sort', 'order', 'explain'].includes(x.type);
  const sh = shuffle(out), res = [];
  sh.forEach(q => { if (heavy(q) && res.length && heavy(res[res.length - 1])) { const k = res.findIndex((x, i) => !heavy(x) && (i === 0 || !heavy(res[i - 1])) && i > 0); if (k > 0) res.splice(k, 0, q); else res.push(q) } else res.push(q) });
  return res;
}

/* ---- js/charts.js ---- */
/* ===== Small chart renderer for data questions ===== */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p }
function chartSVG(f) {
  const W = 440, H = 260, L = 58, Rr = 16, T = 16, B = 56, iw = W - L - Rr, ih = H - T - B;
  const all = f.series.flatMap(s => s.y), ymax = niceMax(Math.max(...all, f.band ? f.band[1] : 0) * 1.05);
  const Y = v => T + ih - v / ymax * ih;
  const cols = ['var(--signal)', 'var(--sky)', 'var(--amber)'];
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.yl)} chart">`;
  const step = ymax / 5;
  for (let i = 0; i <= 5; i++) { const v = step * i, y = Y(v); o += `<line x1="${L}" x2="${W - Rr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1" opacity=".6"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" class="tx">${+v.toFixed(2)}</text>` }
  if (f.band) o += `<rect x="${L}" y="${Y(f.band[1])}" width="${iw}" height="${Y(f.band[0]) - Y(f.band[1])}" fill="var(--mint)" opacity=".16"/><text x="${W - Rr - 4}" y="${Y(f.band[1]) + 13}" text-anchor="end" class="tx" style="fill:var(--mint)">normal range</text>`;
  if (f.kind === 'line') {
    const xmin = f.xs[0], xmax = f.xs[f.xs.length - 1], X = v => L + (v - xmin) / (xmax - xmin) * iw;
    f.xs.forEach(x => { o += `<line x1="${X(x)}" x2="${X(x)}" y1="${T + ih}" y2="${T + ih + 5}" stroke="var(--mut)"/><text x="${X(x)}" y="${T + ih + 19}" text-anchor="middle" class="tx">${x}</text>` });
    f.series.forEach((s, k) => {
      const pts = s.y.map((v, i) => [X(f.xs[i]), Y(v)]);

const GM = {
  new(mode) { return { G: 5, S: 60, I: 0.5, Gc: 0, depot: 0, gut: 0, ex: 0, mode, t: 0 } },
  step(m, dt) {
    const ab = Math.min(m.gut, 1.2 * dt); m.gut -= ab;
    let I = m.I;
    if (m.mode === 'healthy') I += (0.12 * Math.max(0, m.G - 4.8) * dt) + 0.28 * ab; else { const ai = 0.04 * m.depot * dt; m.depot -= ai; I += 5.3 * ai }
    I -= 0.05 * I * dt; m.I = Math.max(0, I);
    const gcT = Math.max(0, 4.5 - m.G) * 0.8; m.Gc += (gcT - m.Gc) * Math.min(1, dt / 5);
    const outBase = 0.024 * (1 - Math.min(1, m.I / 2.5)) + 0.05 * m.Gc;
    const out = m.S > 1 ? outBase : outBase * 0.2;
    const upIns = 0.004 * m.I * m.G, up = 0.0020 * m.G + upIns + (m.ex > 0 ? 0.05 : 0);
    m.G = Math.max(1.2, Math.min(30, m.G + (ab * 0.30 + out - up) * dt));
    m.S = Math.max(0, Math.min(100, m.S + (upIns - out) * 2.5 * dt));
    if (m.ex > 0) m.ex = Math.max(0, m.ex - dt);
    m.t += dt;
  }
};

function plantSim(cfg) {
  const kL = 1.0, kG = .7, kGr = .6, RATE = .35, SUB = 20, DAYS = 7;
  const seed = cfg.sideways ? { x: 105, y: 160 } : { x: 180, y: 176 };
  let a = (cfg.sideways ? 90 : 0) * D2R, b = (cfg.sideways ? 270 : 180) * D2R;
  let sp = { x: seed.x, y: seed.y }, rp = { x: seed.x, y: seed.y };
  const S = [{ ...sp }], Rt = [{ ...rp }], sig = [{ s: 0, r: 0 }];
  const lightOn = cfg.light !== 'none' && !cfg.clino, tl = (LIGHT_DIR[cfg.light] || 0) * D2R;
  for (let i = 0; i < SUB * DAYS; i++) {
    const dt = 1 / SUB; let s = 0, r = 0;

      if (cfg.tip === 'on' && lightOn) s += kL * Math.sin(tl - a);

      r += -kGr * Math.sin(b - Math.PI);
      if (lightOn) r += -.35 * kL * Math.sin(tl - b);

    if (cfg.tip !== 'cut') { a += RATE * s * dt; sp = { x: sp.x + Math.sin(a) * 14 * dt, y: sp.y - Math.cos(a) * 14 * dt } }

  return { S, R: Rt, sig, SUB, seed, a: i => sig[Math.min(i, sig.length - 1)].a, final: { a: a / D2R, b: b / D2R } };
}
const angDiff = d => { d = ((d % 360) + 540) % 360 - 180; return d };

const needsCheck = q => ['order', 'match', 'sort', 'explain'].includes(q.type);

  switch (q.type) {
    case 'mcq': return q.a; case 'tf': return q.a ? 'True' : 'False'; case 'order': return q.steps.join(' > ');
    case 'match': return q.pairs.map(p => p[0] + ': ' + p[1]).join('; '); case 'sort': return q.cats.map((c, k) => c + ': ' + q.items.filter(i => i[1] === k).map(i => i[0]).join(', ')).join('. ');
    case 'label': return DIAG[q.diagram].parts[q.part]; case 'explain': return q.model;
  }
}
function Runner(main, o) {
  const qs = o.qs, sessions = qs.map(() => ({})), results = []; let i = 0, xpTotal = 0, streak = 0;
  function showQ() {

    main.innerHTML = `<div class="runner ${o.tc || (tp ? tp.col : '')}"><div class="rhead"><button class="back" data-quit style="padding:6px 8px 6px 0">${ico('back')}Quit</button><div class="dots" aria-hidden="true">${qs.map((_, k) => `<i class="${k < results.length ? (results[k] >= .99 ? 'ok' : results[k] > 0 ? 'part' : 'no') : k === i ? 'cur' : ''}"></i>`).join('')}</div><span class="num small mut">${i + 1} of ${qs.length}</span></div>
     ${o.story ? `<div class="storybox">${esc(o.story)}</div>` : ''}
     <div class="card qcard in"><div class="qtype">${tp ? `<span class="plateno">Plate ${tp.plate}</span>` : ''}<span>${TYPE_LABEL[q.type]}</span></div><div id="qh"></div><div id="fbh"></div><div class="row" id="act"></div></div></div>`;
    $('[data-quit]', main).onclick = () => o.quit();
    const qh = $('#qh', main), fbh = $('#fbh', main), act = $('#act', main);
    const setBtn = (label, fn, dis) => { act.innerHTML = `<button class="btn pri block" ${dis ? 'disabled' : ''}>${label}</button>`; $('button', act).onclick = fn };
    const api = mountQ(qh, q, sess, {
      mode: 'practice',
      onChange: (v, c) => { if (!revealed && needsCheck(q)) { if (q.type === 'explain') { const b = $('button', act); if (b) b.disabled = !c; else setBtn('Check answer', submit, !c) } else setBtn('Check answer', submit, !c) } },
      onSubmit: submit, onMarks: () => { }
    });
    if (needsCheck(q)) setBtn('Check answer', submit, true);
    function submit() {
      if (revealed) return; revealed = true; sess.reveal = true;
      if (q.type === 'explain') { autoMark(q, sess); api.draw(); setBtn('Done marking', finalize); fbh.innerHTML = `<div class="fb mid">${ico('half')}<div>Here is how the check marked your answer. Tap any point to change it, then press Done marking.</div></div>` }
      else { api.draw(); finalize() }
    }
    function finalize() {
      const frac = gradeQ(q, sess); results.push(frac); rec(q.id, frac);
      streak = frac >= .99 ? streak + 1 : 0;
      let xp = q.type === 'explain' ? q.marks * 6 * frac : BASEXP[q.type] * frac; if (frac >= .99) xp += Math.min(streak, 5) * 2; xp = Math.round(xp);
      xpTotal += xp; addXP(xp); if (xp) xpFly(xp);
      const cls = frac >= .99 ? 'ok' : frac > 0 ? 'mid' : 'no', head = frac >= .99 ? 'Correct.' : frac > 0 ? 'Partly right.' : 'Not quite.';
      let body;
      if (q.type === 'explain') { const got = sess.marks.filter(Boolean).length; body = `${got} of ${q.marks} mark${q.marks > 1 ? 's' : ''}.` }
      else if (q.type === 'match' || q.type === 'sort') { const n = q.type === 'match' ? q.pairs.length : q.items.length; body = `${Math.round(frac * n)} of ${n} right. ${q.why || ''}` }
      else if (q.type === 'mcq' && sess.hinted && frac > 0) body = 'Half marks for using the hint. ' + q.why;
      else if (frac < 1 && q.type === 'mcq') body = `The answer is <b>${esc(q.a)}</b>. ${esc(q.why)}`;
      else if (q.type === 'tf') body = esc(q.why); else if (q.type !== 'label') body = esc(q.why || ''); else body = '';
      fbh.innerHTML = `<div class="fb ${cls}">${ico(cls === 'ok' ? 'check' : cls === 'mid' ? 'half' : 'x')}<div><b>${head}</b> ${body}${xp ? ` <span class="mut">+${xp} XP</span>` : ''}${streak >= 3 ? `<br><span class="mut">${streak} correct in a row.</span>` : ''}</div></div>`;

    }

     ${fin}

     <section class="panel"><h3>Review</h3><div class="review" style="margin-top:12px">${qs.map((q, k) => `<details class="rv"><summary><span class="dot ${results[k] >= .99 ? 'ok' : results[k] > 0 ? 'part' : 'no'}"></span><span class="grow">${esc(q.q)}</span></summary><div class="small" style="margin-top:10px"><b>Answer:</b> ${esc(ansText(q))}${q.why && q.type !== 'explain' ? `<br><span class="mut">${esc(q.why)}</span>` : ''}</div></details>`).join('')}</div></section></div>`;

   <div class="homegrid"><section class="card"><h3>Mastery by plate</h3>${radarSVG(stats.map(s => s.mastery))}<div class="bars" style="margin-top:8px">${TOPICS.map((t, i) => `<div class="bar ${t.col}"><span>Plate ${t.plate}</span><div class="tr"><i style="width:${pct(stats[i].mastery)}%"></i></div><b class="num">${pct(stats[i].mastery)}%</b></div>`).join('')}</div></section>
    <div class="lcol"><section class="card"><h3>Your numbers</h3><div class="readout" style="margin-top:12px"><div class="rd"><b>${tot}</b><span>answers given</span></div><div class="rd"><b>${tot ? pct(ok / tot) + '%' : '-'}</b><span>accuracy</span></div><div class="rd"><b>${p.exams.length ? pct(Math.max(...p.exams.map(e => e.got / e.max))) + '%' : '-'}</b><span>best exam</span></div></div>
     <div class="row" style="margin-top:14px">${mistakes ? `<button class="btn pri" id="mist">Review ${mistakes} mistake${mistakes > 1 ? 's' : ''}</button>` : '<span class="mut small">No open mistakes. Nice.</span>'}</div></section>
     <section class="card"><h3>Send results to your teacher</h3><p class="mut small" style="margin:6px 0 12px">Copy your result code and paste it in your class chat. Your teacher can read it in the Teacher view.</p><div class="codebox" id="code">${esc(makeCode(p))}</div><div class="row" style="margin-top:12px"><button class="btn sm" id="cp">${ico('copy')}Copy code</button></div></section></div></div>
   <section class="panel"><h3>Badges</h3><div class="badges" style="margin-top:12px">${Object.entries(bn).filter(([k]) => earned.includes(k)).map(([k, l]) => `<div class="badge">${ico('star')}<span>${esc(l)}</span></div>`).join('') || '<p class="mut">Finish a lab challenge or a case file to earn your first badge.</p>'}</div></section>
   <section class="panel"><h3>This device</h3><div class="row" style="margin-top:12px"><button class="btn sm" id="sw">Switch student</button><button class="btn sm ghost" id="tc">Teacher view</button><button class="btn sm ghost" id="rst">Reset my progress</button></div><div id="conf"></div></section></div>`;
  const mi = $('#mist', m); if (mi) mi.onclick = () => go('practice', { t: null, mistakes: true });
  $('#cp', m).onclick = async () => { toast(await copyText(makeCode(p)) ? 'Code copied' : 'Select the code and copy it') };
  $('#sw', m).onclick = () => { DB.cur = null; save(); go('home') };
  $('#tc', m).onclick = () => go('teacher');
  $('#rst', m).onclick = () => { $('#conf', m).innerHTML = `<div class="callout" style="margin-top:12px"><b>Delete all progress for ${esc(p.name)}?</b> This cannot be undone.<div class="row" style="margin-top:10px"><button class="btn sm pri" id="yes">Delete progress</button><button class="btn sm ghost" id="no">Keep it</button></div></div>`; $('#no', m).onclick = () => $('#conf', m).innerHTML = ''; $('#yes', m).onclick = () => { DB.profiles[DB.cur] = newProfile(p.name, p.cls); save(); go('me') } };
};

/* ---- js/exam.js ---- */
/* ===== Exam mode: timed paper, no feedback until the end, marks per question ===== */
let EXAM = null;
const GRADE = v => v >= .85 ? 'Excellent' : v >= .7 ? 'Strong' : v >= .55 ? 'Secure' : v >= .4 ? 'Developing' : 'Needs work';
function buildPaper(kind) {
  const used = new Set(), out = [];
  const grab = (f, n = 1) => { const c = shuffle(BANK.filter(q => !used.has(q.id) && f(q))); c.slice(0, n).forEach(q => { used.add(q.id); out.push(q) }) };
  const inT = q => kind === 'full' || q.t === kind;
  if (kind === 'full') {
    TOPICS.forEach((_, t) => grab(q => q.t === t && (q.type === 'mcq' && !q.fig || q.type === 'tf')));
    grab(q => q.type === 'mcq' && q.fig, 2); grab(q => q.type === 'explain' && q.marks >= 3, 2);
    grab(q => q.type === 'order'); grab(q => q.type === 'sort'); grab(q => q.type === 'label'); grab(q => q.type === 'match');
  } else {
    grab(q => inT(q) && (q.type === 'mcq' && !q.fig || q.type === 'tf'), 3); grab(q => inT(q) && q.type === 'mcq' && q.fig); grab(q => inT(q) && q.type === 'explain'); grab(q => inT(q) && (q.type === 'order' || q.type === 'sort')); grab(q => inT(q) && (q.type === 'label' || q.type === 'match'));
    if (out.length < 8) grab(q => inT(q) && (q.type === 'mcq' || q.type === 'tf'), 8 - out.length);
  }
  const rank = q => q.type === 'explain' ? 3 : (q.type === 'mcq' && q.fig) ? 1 : ['order', 'sort', 'label', 'match'].includes(q.type) ? 2 : 0;
  return out.map((q, i) => [rank(q) + Math.random() * .5, q]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
const fmtT = s => Math.floor(s / 60) + ':' + String(Math.max(0, s % 60)).padStart(2, '0');

VIEWS.exam = m => {
  const p = P(), last = p.exams.slice(-5).reverse();
  m.innerHTML = `<div class="view"><div><h2>Exam mode</h2><p class="mut">A timed paper with no hints and no feedback until the end. Marks are shown per question, like a real paper.</p></div>
   <div class="actions"><button class="btn pri" data-k="full">${ico('exam')}Full paper: 13 questions, 20 minutes</button></div>
   <section class="panel"><h3>Single plate papers</h3><p class="mut small" style="margin:4px 0 12px">8 questions, 10 minutes.</p><div class="tlist">${TOPICS.map((t, i) => `<button class="trow ${t.col}" data-k="${i}"><span class="pn">${t.plate}</span><span><h3>${t.n}</h3></span><span>${ico('next')}</span></button>`).join('')}</div></section>
   ${last.length ? `<section class="panel"><h3>Recent papers</h3><table class="table" style="margin-top:10px"><thead><tr><th>Date</th><th>Paper</th><th>Marks</th><th>Result</th></tr></thead><tbody>${last.map(e => `<tr><td>${new Date(e.d).toLocaleDateString()}</td><td>${e.kind === 'full' ? 'Full paper' : 'Plate ' + TOPICS[e.kind].plate}</td><td>${e.got} / ${e.max}</td><td>${GRADE(e.got / e.max)}</td></tr>`).join('')}</tbody></table></section>` : ''}</div>`;
  $$('[data-k]', m).forEach(b => b.onclick = () => { const k = b.dataset.k === 'full' ? 'full' : +b.dataset.k; const qs = buildPaper(k); EXAM = { kind: k, qs, sess: qs.map(() => ({})), idx: 0, flags: new Set(), secs: k === 'full' ? 1200 : 600, left: k === 'full' ? 1200 : 600, done: false }; go('examrun') });
};

VIEWS.examrun = m => {
  if (!EXAM || EXAM.done) return go('exam');
  const E = EXAM; let tm = null, confirm = false;
  const answered = i => completeQ(E.qs[i], E.sess[i]);
  function draw() {
    const q = E.qs[E.idx], s = E.sess[E.idx], tp = TOPICS[q.t], un = E.qs.filter((_, i) => !answered(i)).length;
    m.innerHTML = `<div class="runner ${tp.col}"><div class="rhead"><span class="timer ${E.left < 120 ? 'low' : ''}" id="tmr" role="timer">${fmtT(E.left)}</span><span class="grow"></span><span class="small mut num">Question ${E.idx + 1} of ${E.qs.length} · ${marksOf(q)} mark${marksOf(q) > 1 ? 's' : ''}</span></div>
     <div class="qnav">${E.qs.map((_, i) => `<button class="${answered(i) ? 'done' : ''} ${i === E.idx ? 'cur' : ''} ${E.flags.has(i) ? 'flag' : ''}" data-i="${i}" aria-label="Question ${i + 1}${E.flags.has(i) ? ' flagged' : ''}">${i + 1}</button>`).join('')}</div>
     <div class="card qcard"><div class="qtype"><span class="plateno">Plate ${tp.plate}</span><span>${TYPE_LABEL[q.type]}</span></div><div id="qh"></div></div>
     <div class="row"><button class="btn" id="pv" ${E.idx === 0 ? 'disabled' : ''}>Previous</button><button class="btn" id="nx" ${E.idx === E.qs.length - 1 ? 'disabled' : ''}>Next</button><button class="btn ghost" id="fl">${ico('flag')}${E.flags.has(E.idx) ? 'Unflag' : 'Flag for later'}</button><span class="grow"></span><button class="btn pri" id="fin">Finish paper</button></div>
     ${confirm ? `<div class="callout"><b>${un ? un + ' question' + (un > 1 ? 's are' : ' is') + ' unanswered.' : 'All questions answered.'}</b> Finish and see your marks?<div class="row" style="margin-top:10px"><button class="btn sm pri" id="yes">Finish and mark</button><button class="btn sm ghost" id="no">Keep working</button></div></div>` : ''}</div>`;
    mountQ($('#qh', m), q, s, { mode: 'exam', onChange: () => { const b = $$('.qnav button', m)[E.idx]; if (b) b.classList.toggle('done', answered(E.idx)) } });
    $$('.qnav button', m).forEach(b => b.onclick = () => { E.idx = +b.dataset.i; confirm = false; draw() });
    $('#pv', m).onclick = () => { E.idx--; confirm = false; draw(); window.scrollTo(0, 0) }; $('#nx', m).onclick = () => { E.idx++; confirm = false; draw(); window.scrollTo(0, 0) };
    $('#fl', m).onclick = () => { E.flags.has(E.idx) ? E.flags.delete(E.idx) : E.flags.add(E.idx); draw() };
    $('#fin', m).onclick = () => { confirm = true; draw(); $('#yes', m).scrollIntoView({ block: 'center' }) };
    const y = $('#yes', m); if (y) { y.onclick = finish; $('#no', m).onclick = () => { confirm = false; draw() } }
  }
  function finish() { clearInterval(tm); E.done = true; go('examres') }
  tm = setInterval(() => { E.left--; const t = $('#tmr', m); if (t) { t.textContent = fmtT(E.left); t.classList.toggle('low', E.left < 120) } if (E.left <= 0) { toast('Time is up'); finish() } }, 1000);
  onLeave(() => clearInterval(tm));
  draw();
};

VIEWS.examres = m => {
  if (!EXAM) return go('exam');
  const E = EXAM, p = P();
  const earn = i => { const q = E.qs[i], f = gradeQ(q, E.sess[i]), mk = marksOf(q); return q.type === 'explain' ? E.sess[i].marks.filter(Boolean).length : Math.round(f * mk * 2) / 2 };
  const totals = () => { const by = TOPICS.map(() => [0, 0]); let got = 0, max = 0; E.qs.forEach((q, i) => { const g = earn(i), mx = marksOf(q); by[q.t][0] += g; by[q.t][1] += mx; got += g; max += mx }); return { by, got, max } };
  if (!E.saved) {
    E.saved = true; const t = totals(); E.qs.forEach((q, i) => rec(q.id, gradeQ(q, E.sess[i])));
    E.rec = { d: Date.now(), kind: E.kind, got: t.got, max: t.max, by: t.by }; p.exams.push(E.rec); if (p.exams.length > 30) p.exams.shift(); save();
    addXP(Math.round(t.got * 3)); if (t.got / t.max >= .8) { award('exam-80', 'Exam 80% or more'); confetti(); sfx('win') }
  }
  function paint() {
    const t = totals(); E.rec.got = t.got; E.rec.by = t.by; save();
    const v = t.got / t.max;
    $('#hd', m).innerHTML = `<div class="sum-top"><div class="bigscore">${t.got % 1 ? t.got.toFixed(1) : t.got}<span class="mut" style="font-size:.4em">/${t.max}</span></div><div><h2>${GRADE(v)}</h2><p class="mut">${pct(v)}% · ${E.kind === 'full' ? 'Full paper' : 'Plate ' + TOPICS[E.kind].plate} · +${Math.round(t.got * 3)} XP</p></div></div>
     <div class="bars" style="margin-top:16px">${TOPICS.map((tp, i) => t.by[i][1] ? `<div class="bar ${tp.col}"><span>Plate ${tp.plate}</span><div class="tr"><i style="width:${pct(t.by[i][0] / t.by[i][1])}%"></i></div><b class="num">${t.by[i][0] % 1 ? t.by[i][0].toFixed(1) : t.by[i][0]}/${t.by[i][1]}</b></div>` : '').join('')}</div>`;
    $$('.rvm', m).forEach((el, i) => { const g = earn(i), mx = marksOf(E.qs[i]); el.textContent = `${g % 1 ? g.toFixed(1) : g}/${mx}`; el.parentElement.querySelector('.dot').className = 'dot ' + (g >= mx ? 'ok' : g > 0 ? 'part' : 'no') });
  }
  const weak = (() => { const t = totals(); let w = -1, wv = 2; t.by.forEach((b, i) => { if (b[1] && b[0] / b[1] < wv) { wv = b[0] / b[1]; w = i } }); return w })();
  m.innerHTML = `<div class="view runner"><div id="hd"></div>
   <div class="row"><button class="btn pri" id="again">New paper</button>${weak >= 0 ? `<button class="btn" id="wk">Practise Plate ${TOPICS[weak].plate}</button>` : ''}<button class="btn ghost" id="bk">Exam home</button></div>
   <section class="panel"><h3>Question by question</h3><p class="mut small" style="margin:4px 0 12px">Written answers were marked by keyword. Tap a mark point to change it.</p><div class="review">${E.qs.map((q, i) => `<details class="rv"><summary><span class="dot"></span><span class="grow">${i + 1}. ${esc(q.q)}</span><b class="rvm num"></b></summary><div class="rvh" data-i="${i}" style="margin-top:12px"></div></details>`).join('')}</div></section></div>`;
  $$('.rvh', m).forEach(h => { const i = +h.dataset.i; const s = E.sess[i]; s.reveal = true; mountQ(h, E.qs[i], s, { mode: 'review', onMarks: paint }) });
  paint();
  $('#again', m).onclick = () => go('exam'); $('#bk', m).onclick = () => go('exam'); const wk = $('#wk', m); if (wk) wk.onclick = () => go('practice', { t: weak });
  window.scrollTo(0, 0);
};

/* ---- js/teacher.js ---- */
/* ===== Result codes and the teacher view (works with no server: paste codes, read the class) ===== */
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
const chk = s => { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 99991; return h.toString(36) };
function makeCode(p) {
  const st = TOPICS.map((_, i) => topicStats(i)), tot = Object.values(p.q).reduce((a, r) => a + r.n, 0), ok = Object.values(p.q).reduce((a, r) => a + r.ok, 0);
  const o = { n: p.name, c: p.cls, x: p.xp, m: st.map(s => pct(s.mastery)), a: tot ? pct(ok / tot) : 0, q: tot, e: p.exams.length ? pct(Math.max(...p.exams.map(e => e.got / e.max))) : -1, d: day(), b: Object.keys(p.badges).length };
  const b = b64u(JSON.stringify(o)); return 'SIG1.' + b + '.' + chk(b);
}
function parseCode(t) {
  t = t.trim(); const m = t.match(/^SIG1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)$/); if (!m) return null;
  try { const o = JSON.parse(unb64u(m[1])); o.ok = chk(m[1]) === m[2]; return o } catch (e) { return null }
}
VIEWS.teacher = (m, a) => {
  const saved = (DB.teacher || '');
  m.innerHTML = `<div class="view"><button class="back" id="bk">${ico('back')}${DB.cur ? 'Back' : 'Sign in'}</button>
   <div><h2>Teacher view</h2><p class="mut" style="max-width:62ch">Ask students to copy their result code from the Me tab and paste it into your class chat. Paste the codes here, one per line. Nothing leaves this device.</p></div>
   <textarea class="codes" id="codes" placeholder="SIG1.eyJu..." aria-label="Result codes, one per line">${esc(saved)}</textarea>
   <div class="row"><button class="btn pri" id="go">Read codes</button><button class="btn ghost" id="clr">Clear</button></div>
   <div id="out"></div></div>`;
  $('#bk', m).onclick = () => go('home');
  const run = () => {
    const raw = $('#codes', m).value; DB.teacher = raw; save();
    const lines = raw.split(/\s+/).filter(Boolean), rows = [], bad = [];
    lines.forEach(l => { const o = parseCode(l.replace(/^.*?(SIG1\.)/, '$1')); if (o) rows.push(o); else bad.push(l.slice(0, 14)) });
    // keep latest per name
    const byName = {}; rows.forEach(r => { const k = (r.c + '|' + r.n).toLowerCase(); if (!byName[k] || r.d >= byName[k].d) byName[k] = r }); const list = Object.values(byName).sort((x, y) => x.n.localeCompare(y.n));
    if (!list.length) { $('#out', m).innerHTML = lines.length ? '<div class="callout">None of those lines look like result codes. A code starts with SIG1.</div>' : ''; return }
    const avg = TOPICS.map((_, i) => Math.round(list.reduce((s, r) => s + r.m[i], 0) / list.length));
    let wk = 0; avg.forEach((v, i) => { if (v < avg[wk]) wk = i });
    const heat = v => `<span class="heat" style="background:color-mix(in srgb,${v >= 60 ? 'var(--good)' : v >= 30 ? 'var(--amber)' : 'var(--bad)'} ${Math.max(14, Math.min(60, v / 1.6))}%,transparent)">${v}</span>`;
    const need = list.filter(r => r.q > 0 && (r.a < 55 || r.m.reduce((s, v) => s + v, 0) / 5 < 15)).map(r => r.n);
    $('#out', m).innerHTML = `<div class="card"><h3>Class of ${list.length}</h3><p class="mut" style="margin-top:6px">Weakest plate on average: <b>Plate ${TOPICS[wk].plate}, ${TOPICS[wk].n}</b> (${avg[wk]}% mastery).${need.length ? ` Check in with: <b>${esc(need.join(', '))}</b>.` : ''}</p></div>
     <div class="scroll-x"><table class="table"><thead><tr><th>Name</th><th>Class</th><th>XP</th>${TOPICS.map(t => `<th title="${t.n}">${t.plate}</th>`).join('')}<th>Accuracy</th><th>Best exam</th><th>Answers</th><th></th></tr></thead><tbody>
     ${list.map(r => `<tr><td><b>${esc(r.n)}</b></td><td>${esc(r.c)}</td><td>${r.x}</td>${r.m.map(heat).map(x => `<td>${x}</td>`).join('')}<td>${r.a}%</td><td>${r.e >= 0 ? r.e + '%' : '-'}</td><td>${r.q}</td><td>${r.ok ? '' : '<span class="pill" style="color:var(--bad)">edited</span>'}</td></tr>`).join('')}
     <tr><td><b>Average</b></td><td></td><td>${Math.round(list.reduce((s, r) => s + r.x, 0) / list.length)}</td>${avg.map(v => `<td>${heat(v)}</td>`).join('')}<td>${Math.round(list.reduce((s, r) => s + r.a, 0) / list.length)}%</td><td></td><td></td><td></td></tr></tbody></table></div>
     ${bad.length ? `<p class="small mut">${bad.length} line${bad.length > 1 ? 's' : ''} could not be read.</p>` : ''}<div class="row"><button class="btn sm" id="csv">${ico('copy')}Copy as CSV</button></div><p class="tiny mut">Plate numbers: ${TOPICS.map(t => t.plate + ' ' + t.n).join(', ')}. Numbers under plates are mastery percentages. Codes are not secure, so treat them as a quick check, not an assessment record.</p>`;
    $('#csv', m).onclick = async () => { const csv = ['Name,Class,XP,' + TOPICS.map(t => 'Plate ' + t.plate).join(',') + ',Accuracy,Best exam,Answers', ...list.map(r => [r.n, r.c, r.x, ...r.m, r.a, r.e, r.q].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(','))].join('\n'); toast(await copyText(csv) ? 'CSV copied' : 'Could not copy') };
  };
  $('#go', m).onclick = run; $('#clr', m).onclick = () => { $('#codes', m).value = ''; run() };
  if (saved) run();
};
